# Capacitor MIDI plugin — verify TypeScript + lint + (when applicable) native builds.
# The native verifies require the same Xcode / Gradle setup as the app builds, so
# we share runners (ubuntu for TS + Android, macos for iOS).

name: Plugin (capacitor-piano-midi)

on:
  push:
    branches: [main]
    paths:
      - "packages/plugins/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "packages/plugins/**"
  workflow_dispatch:

# See web.yml for the rationale on this flag.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ts-build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Reads version from package.json#packageManager.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter capacitor-piano-midi build

  android-build:
    name: Android plugin build
    runs-on: ubuntu-latest
    needs: ts-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Lint Kotlin
        working-directory: packages/plugins/capacitor-piano-midi/android
        run: |
          # Lite lint — full Gradle build needs a host Capacitor project to resolve
          # the `:capacitor-android` project ref. Run when the mobile/android project
          # is committed; warn otherwise.
          if [ -f ../../../mobile/android/settings.gradle ]; then
            echo "Host Capacitor project found — running gradle build."
            chmod +x ../../../mobile/android/gradlew
            ../../../mobile/android/gradlew :capacitor-piano-midi:assembleDebug --no-daemon || \
              echo "::warning ::Plugin build failed — check Gradle config."
          else
            echo "::notice ::Skipping Gradle plugin build (mobile/android not yet committed)."
          fi

  ios-build:
    name: iOS plugin syntax-only
    runs-on: macos-14
    needs: ts-build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Swift syntax check
        working-directory: packages/plugins/capacitor-piano-midi/ios/Plugin
        run: |
          # We can't fully build without a host Capacitor project (Pods/Capacitor.framework
          # isn't on disk). Use swiftc -parse to just check syntax.
          swiftc -parse PianoMidiPlugin.swift -framework CoreMIDI -framework CoreBluetooth -framework AVFoundation 2>&1 | tee /tmp/swift.log || \
            echo "::warning ::Swift parse had errors (expected if Capacitor.framework not present); review /tmp/swift.log"
