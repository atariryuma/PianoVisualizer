# Web build — runs on every PR + push to main.
# Verifies the legacy single-file build (root index.html / app.css / app.js)
# AND the Vite shell (packages/web). Once Phase 0b extraction completes,
# the legacy step can be deleted. Push to main also auto-deploys the
# legacy build to GitHub Pages (deploy-pages job below).

name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Opt the GitHub Actions JS runner into Node 24 ahead of the default flip
# (currently 2026-06-02). Without this, the runner emits a deprecation
# warning on every job because actions/checkout @ v4 + actions/setup-node
# @ v4 still execute their JS shims on Node 20 internally.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Allow only one Pages deploy at a time per ref; cancel in-progress runs
# of the same ref so the latest push wins instead of stale ones racing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-syntax-check:
    name: Legacy single-file build (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify app.js parses
        run: node --check app.js

      # NOTE: HTML well-formedness via xmllint was removed — it flags HTML5
      # elements like <canvas> as "invalid". Vite build (vite-build job below)
      # is the authoritative HTML validator.

      - name: Service worker syntax
        run: node --check sw.js

  vite-build:
    name: Vite shell build
    runs-on: ubuntu-latest
    needs: legacy-syntax-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads version from package.json#packageManager — keep both in sync there.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @piano/core typecheck && pnpm --filter @piano/web typecheck

      - name: Build web
        run: pnpm --filter @piano/web build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist/
          if-no-files-found: warn
          retention-days: 7

  # Deploy the legacy single-file build (root index.html + app.css + app.js
  # + sw.js + assets/ + dist-legacy/) to GitHub Pages. Vite shell is NOT
  # deployed yet — `index.html` at the repo root is the production entry.
  # First run requires the repo's Settings → Pages → Source = "GitHub Actions".
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [legacy-syntax-check, vite-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage legacy build artifacts
        # Whitelist runtime files only — keep PowerShell server scripts,
        # self-signed certs, source packages, and tooling out of the public
        # bundle so the published site mirrors the LAN dev experience.
        run: |
          mkdir -p _site/dist-legacy _site/assets
          cp index.html app.css app.js sw.js manifest.json icon.svg piano-visualizer.html _site/
          cp dist-legacy/core-bundle.js _site/dist-legacy/
          cp -r assets/. _site/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
