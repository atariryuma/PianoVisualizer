# Web build — runs on every PR + push to main.
# Phase 0b.3 (2026-05-06) retired the repo-root 3-file shell; the Vite shell
# at packages/web/ is now the single production entry. Push to main
# auto-deploys packages/web/dist/ to GitHub Pages.

name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Opt the GitHub Actions JS runner into Node 24 ahead of the default flip
# (currently 2026-06-02). Without this, the runner emits a deprecation
# warning on every job because actions/checkout @ v4 + actions/setup-node
# @ v4 still execute their JS shims on Node 20 internally.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Allow only one Pages deploy at a time per ref; cancel in-progress runs
# of the same ref so the latest push wins instead of stale ones racing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-build:
    name: Vite shell build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads version from package.json#packageManager — keep both in sync there.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + format check
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Test (@piano/core)
        run: pnpm --filter @piano/core test -- --run

      - name: Build web
        run: pnpm --filter @piano/web build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist/
          if-no-files-found: error
          retention-days: 7

  # Deploy packages/web/dist/ to GitHub Pages. First run requires the
  # repo's Settings → Pages → Source = "GitHub Actions".
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: vite-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
